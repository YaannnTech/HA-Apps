server {
    listen @INGRESS_PORT@;
    server_name _;

    location = /health {
        proxy_pass http://127.0.0.1:@WEB_PORT@/health;
    }

    location / {
        allow 172.30.32.2;
        deny all;

        proxy_pass http://127.0.0.1:@WEB_PORT@;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix $http_x_ingress_path;
    }
}