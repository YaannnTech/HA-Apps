server {
    listen @INGRESS_PORT@;
    server_name _;

    # The service takes a dialog set of up to 2 MB (POST /api/dialog).
    client_max_body_size 2m;

    location = /health {
        proxy_pass http://127.0.0.1:@WEB_PORT@/health;
    }

    location / {
        allow 172.30.32.2;
        deny all;

        proxy_pass http://127.0.0.1:@WEB_PORT@;
        proxy_set_header Host $host;
        # Home Assistant's X-Ingress-Path header passes through unchanged; the
        # service offers the code link instead of the web sign-in when it is
        # present.
    }
}
