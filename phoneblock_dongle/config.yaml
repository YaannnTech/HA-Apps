name: PhoneBlock
version: "2.0.1.2"
slug: phoneblock_dongle
description: Run the "Phoneblock Dongle" as a Home Assistant App instead of a physical ESP32 Dongle
url: https://github.com/YaannnTech/HA-Apps/tree/main/phoneblock_dongle
arch:
  - amd64
  - aarch64
startup: services
init: false
host_network: true
schema:
  phoneblock_token: password?
  contact_host: str?
  contact_port: port?
  verbose_log: bool?
map:
  - type: data
    read_only: false
ingress: true
ingress_port: 0
hassio_api: true
homeassistant_api: true
panel_icon: mdi:phone-alert
panel_title: PhoneBlock
