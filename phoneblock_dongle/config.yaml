name: PhoneBlock Dongle
version: "0.1.2"
slug: phoneblock_dongle
description: Native Linux PhoneBlock SIP spam-call blocker
url: https://github.com/YaannnTech/phoneblock/tree/linux-core-extraction/phoneblock-dongle
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
host_network: true
webui: http://[HOST]:[PORT:8080]/
options:
  sip_host: fritz.box
  sip_port: 5060
  sip_user: ""
  sip_pass: ""
  sip_expires: 3600
  sip_local_port: 15060
  rtp_port: 16000
  phoneblock_base_url: https://phoneblock.net/phoneblock
  phoneblock_token: ""
  announcement_path: /data/announcement.alaw
schema:
  sip_host: str
  sip_port: port
  sip_user: str
  sip_pass: password
  sip_expires: int(60,86400)
  sip_local_port: port
  rtp_port: port
  phoneblock_base_url: url
  phoneblock_token: password
  announcement_path: str
map:
  - type: data
    read_only: false
watchdog: http://[HOST]:8080/health
panel_icon: mdi:phone-alert
