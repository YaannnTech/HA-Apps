configuration:
  phoneblock_token:
    name: PhoneBlock token
    description: Required. PhoneBlock API token (starts with pbt_) from your PhoneBlock account. It replaces the stored token on every start; to change it, update it here and restart the app.
  contact_host:
    name: Advertised host
    description: Optional. Hostname or IP address the SIP registrar should use to reach this app, for NAT or routed setups. Leave empty to detect it automatically.
  contact_port:
    name: Advertised SIP port
    description: Optional. UDP port the registrar should use to reach this app, for example a forwarded port. Leave empty to use the local SIP port.
  verbose_log:
    name: Verbose log
    description: Optional. Include full SIP messages, keepalives and registration handshakes in the log. Enable only when troubleshooting.